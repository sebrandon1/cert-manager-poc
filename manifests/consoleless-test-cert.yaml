apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager-poc
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: selfsigned
  namespace: cert-manager-poc
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: consoleless-test
  namespace: cert-manager-poc
spec:
  secretName: consoleless-test-tls
  commonName: consoleless.example.com
  dnsNames:
  - consoleless.example.com
  issuerRef:
    name: selfsigned
    kind: Issuer
  privateKey:
    algorithm: ECDSA
    size: 256
