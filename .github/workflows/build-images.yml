name: Build and publish POC images

on:
  schedule:
    # 06:00 UTC = midnight CST / 01:00 CDT.
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      lifecycle_ref:
        description: lifecycle-agent ref (branch, tag, or SHA)
        required: true
        default: main
      recert_ref:
        description: recert ref (branch, tag, or SHA)
        required: true
        default: main
      cert_manager_ref:
        description: cert-manager-operator ref (branch, tag, or SHA)
        required: true
        default: master
      image_tag:
        description: Override tag for every image; use auto for readable ref-SHA tags
        required: true
        default: auto

permissions:
  contents: read

concurrency:
  group: poc-image-build
  cancel-in-progress: false

env:
  REGISTRY: quay.io
  QUAY_NAMESPACE: bapalm
  LIFECYCLE_REPOSITORY: openshift-kni/lifecycle-agent
  RECERT_REPOSITORY: rh-ecosystem-edge/recert
  CERT_MANAGER_REPOSITORY: openshift/cert-manager-operator
  CERT_MANAGER_BUNDLE_VERSION: 1.20.0
  LIFECYCLE_BUNDLE_VERSION: 5.1.0

jobs:
  resolve-sources:
    name: Resolve sources and image tags
    runs-on: ubuntu-24.04
    outputs:
      lifecycle_sha: ${{ steps.resolve.outputs.lifecycle_sha }}
      recert_sha: ${{ steps.resolve.outputs.recert_sha }}
      cert_manager_sha: ${{ steps.resolve.outputs.cert_manager_sha }}
      lifecycle_image: ${{ steps.resolve.outputs.lifecycle_image }}
      recert_image: ${{ steps.resolve.outputs.recert_image }}
      cert_manager_image: ${{ steps.resolve.outputs.cert_manager_image }}
      lifecycle_bundle_image: ${{ steps.resolve.outputs.lifecycle_bundle_image }}
      lifecycle_catalog_image: ${{ steps.resolve.outputs.lifecycle_catalog_image }}
      cert_manager_bundle_image: ${{ steps.resolve.outputs.cert_manager_bundle_image }}
      cert_manager_catalog_image: ${{ steps.resolve.outputs.cert_manager_catalog_image }}
    steps:
      - name: Check out lifecycle-agent
        uses: actions/checkout@v6
        with:
          repository: ${{ env.LIFECYCLE_REPOSITORY }}
          ref: ${{ inputs.lifecycle_ref || 'main' }}
          path: lifecycle-agent
          fetch-depth: 1

      - name: Check out recert
        uses: actions/checkout@v6
        with:
          repository: ${{ env.RECERT_REPOSITORY }}
          ref: ${{ inputs.recert_ref || 'main' }}
          path: recert
          fetch-depth: 1

      - name: Check out cert-manager-operator
        uses: actions/checkout@v6
        with:
          repository: ${{ env.CERT_MANAGER_REPOSITORY }}
          ref: ${{ inputs.cert_manager_ref || 'master' }}
          path: cert-manager-operator
          fetch-depth: 1

      - name: Resolve commits and tags
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          lifecycle_sha="$(git -C lifecycle-agent rev-parse HEAD)"
          recert_sha="$(git -C recert rev-parse HEAD)"
          cert_manager_sha="$(git -C cert-manager-operator rev-parse HEAD)"

          ref_label() {
            local ref="${1##*/}"
            if [[ "$ref" =~ ^[0-9a-f]{40}$ ]]; then
              ref=sha
            fi
            ref="${ref//[^A-Za-z0-9_.-]/-}"
            printf '%s' "$ref"
          }

          lifecycle_ref="${{ inputs.lifecycle_ref || 'main' }}"
          recert_ref="${{ inputs.recert_ref || 'main' }}"
          cert_manager_ref="${{ inputs.cert_manager_ref || 'master' }}"
          image_tag="${{ inputs.image_tag || 'auto' }}"

          if [[ "$image_tag" == auto ]]; then
            lifecycle_tag="$(ref_label "$lifecycle_ref")-${lifecycle_sha:0:6}"
            recert_tag="$(ref_label "$recert_ref")-${recert_sha:0:6}"
            cert_manager_tag="$(ref_label "$cert_manager_ref")-${cert_manager_sha:0:6}"
          else
            lifecycle_tag="$image_tag"
            recert_tag="$image_tag"
            cert_manager_tag="$image_tag"
          fi

          lifecycle_image="${REGISTRY}/${QUAY_NAMESPACE}/lifecycle-agent-operator:${lifecycle_tag}"
          recert_image="${REGISTRY}/${QUAY_NAMESPACE}/recert:${recert_tag}"
          cert_manager_image="${REGISTRY}/${QUAY_NAMESPACE}/cert-manager-operator:${cert_manager_tag}"
          lifecycle_bundle_image="${REGISTRY}/${QUAY_NAMESPACE}/lifecycle-agent-operator-bundle:${lifecycle_tag}"
          lifecycle_catalog_image="${REGISTRY}/${QUAY_NAMESPACE}/lifecycle-agent-operator-catalog:${lifecycle_tag}"
          cert_manager_bundle_image="${REGISTRY}/${QUAY_NAMESPACE}/cert-manager-operator-bundle:${cert_manager_tag}"
          cert_manager_catalog_image="${REGISTRY}/${QUAY_NAMESPACE}/cert-manager-operator-catalog:${cert_manager_tag}"

          {
            echo "lifecycle_sha=$lifecycle_sha"
            echo "recert_sha=$recert_sha"
            echo "cert_manager_sha=$cert_manager_sha"
            echo "lifecycle_image=$lifecycle_image"
            echo "recert_image=$recert_image"
            echo "cert_manager_image=$cert_manager_image"
            echo "lifecycle_bundle_image=$lifecycle_bundle_image"
            echo "lifecycle_catalog_image=$lifecycle_catalog_image"
            echo "cert_manager_bundle_image=$cert_manager_bundle_image"
            echo "cert_manager_catalog_image=$cert_manager_catalog_image"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Sources"
            echo "- lifecycle-agent: \`$lifecycle_sha\`"
            echo "- recert: \`$recert_sha\`"
            echo "- cert-manager-operator: \`$cert_manager_sha\`"
            echo ""
            echo "### Final image tags"
            echo "- recert: \`$recert_image\`"
            echo "- lifecycle-agent: \`$lifecycle_image\`"
            echo "- cert-manager-operator: \`$cert_manager_image\`"
          } >> "$GITHUB_STEP_SUMMARY"

  build-recert:
    name: Build recert (${{ matrix.arch }})
    needs: resolve-sources
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    steps:
      - name: Check out recert
        uses: actions/checkout@v6
        with:
          repository: ${{ env.RECERT_REPOSITORY }}
          ref: ${{ needs.resolve-sources.outputs.recert_sha }}
          path: recert
          fetch-depth: 1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Quay
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Build and publish recert architecture image
        uses: docker/build-push-action@v7
        with:
          context: ./recert
          file: ./recert/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ needs.resolve-sources.outputs.recert_image }}-${{ matrix.arch }}
          cache-from: type=gha,scope=recert-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=recert-${{ matrix.arch }}
          provenance: false
          sbom: false

  build-lifecycle-agent:
    name: Build lifecycle-agent (${{ matrix.arch }})
    needs: resolve-sources
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    steps:
      - name: Check out lifecycle-agent
        uses: actions/checkout@v6
        with:
          repository: ${{ env.LIFECYCLE_REPOSITORY }}
          ref: ${{ needs.resolve-sources.outputs.lifecycle_sha }}
          path: lifecycle-agent
          fetch-depth: 1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Quay
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Build and publish lifecycle-agent architecture image
        uses: docker/build-push-action@v7
        with:
          context: ./lifecycle-agent
          file: ./lifecycle-agent/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ needs.resolve-sources.outputs.lifecycle_image }}-${{ matrix.arch }}
          build-args: |
            GIT_COMMIT=${{ needs.resolve-sources.outputs.lifecycle_sha }}
            VERSION=${{ env.LIFECYCLE_BUNDLE_VERSION }}
          cache-from: type=gha,scope=lifecycle-agent-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=lifecycle-agent-${{ matrix.arch }}
          provenance: false
          sbom: false

  build-cert-manager-operator:
    name: Build cert-manager-operator (${{ matrix.arch }})
    needs: resolve-sources
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    steps:
      - name: Check out cert-manager-operator
        uses: actions/checkout@v6
        with:
          repository: ${{ env.CERT_MANAGER_REPOSITORY }}
          ref: ${{ needs.resolve-sources.outputs.cert_manager_sha }}
          path: cert-manager-operator
          fetch-depth: 1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Quay
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Build and publish cert-manager architecture image
        uses: docker/build-push-action@v7
        with:
          context: ./cert-manager-operator
          file: ./cert-manager-operator/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ needs.resolve-sources.outputs.cert_manager_image }}-${{ matrix.arch }}
          cache-from: type=gha,scope=cert-manager-operator-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=cert-manager-operator-${{ matrix.arch }}
          provenance: false
          sbom: false

  publish-runtime-manifests:
    name: Publish runtime multi-arch manifests
    needs:
      - resolve-sources
      - build-recert
      - build-lifecycle-agent
      - build-cert-manager-operator
    runs-on: ubuntu-24.04
    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Quay
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Combine architecture images
        shell: bash
        env:
          RECERT_IMAGE: ${{ needs.resolve-sources.outputs.recert_image }}
          LIFECYCLE_IMAGE: ${{ needs.resolve-sources.outputs.lifecycle_image }}
          CERT_MANAGER_IMAGE: ${{ needs.resolve-sources.outputs.cert_manager_image }}
        run: |
          set -euo pipefail

          for image in "$RECERT_IMAGE" "$LIFECYCLE_IMAGE" "$CERT_MANAGER_IMAGE"; do
            docker buildx imagetools create \
              --tag "$image" \
              "${image}-amd64" \
              "${image}-arm64"
          done

  build-bundles-and-catalogs:
    name: Build bundles and catalogs
    needs:
      - resolve-sources
      - publish-runtime-manifests
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out lifecycle-agent
        uses: actions/checkout@v6
        with:
          repository: ${{ env.LIFECYCLE_REPOSITORY }}
          ref: ${{ needs.resolve-sources.outputs.lifecycle_sha }}
          path: lifecycle-agent
          fetch-depth: 1

      - name: Check out cert-manager-operator
        uses: actions/checkout@v6
        with:
          repository: ${{ env.CERT_MANAGER_REPOSITORY }}
          ref: ${{ needs.resolve-sources.outputs.cert_manager_sha }}
          path: cert-manager-operator
          fetch-depth: 1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Quay
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Generate operator bundles
        shell: bash
        env:
          LIFECYCLE_IMAGE: ${{ needs.resolve-sources.outputs.lifecycle_image }}
          LIFECYCLE_BUNDLE_IMAGE: ${{ needs.resolve-sources.outputs.lifecycle_bundle_image }}
          CERT_MANAGER_IMAGE: ${{ needs.resolve-sources.outputs.cert_manager_image }}
          CERT_MANAGER_BUNDLE_IMAGE: ${{ needs.resolve-sources.outputs.cert_manager_bundle_image }}
        run: |
          set -euo pipefail

          make -C cert-manager-operator bundle \
            CONTAINER_ENGINE=docker \
            IMG="$CERT_MANAGER_IMAGE" \
            BUNDLE_IMG="$CERT_MANAGER_BUNDLE_IMAGE" \
            BUNDLE_VERSION="$CERT_MANAGER_BUNDLE_VERSION"

          make -C lifecycle-agent bundle \
            ENGINE=docker \
            IMG="$LIFECYCLE_IMAGE" \
            BUNDLE_IMG="$LIFECYCLE_BUNDLE_IMAGE" \
            VERSION="$LIFECYCLE_BUNDLE_VERSION"

      - name: Build and publish cert-manager bundle
        uses: docker/build-push-action@v7
        with:
          context: ./cert-manager-operator
          file: ./cert-manager-operator/bundle.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.resolve-sources.outputs.cert_manager_bundle_image }}
          cache-from: type=gha,scope=cert-manager-bundle
          cache-to: type=gha,mode=max,scope=cert-manager-bundle
          provenance: false
          sbom: false

      - name: Build and publish lifecycle-agent bundle
        uses: docker/build-push-action@v7
        with:
          context: ./lifecycle-agent
          file: ./lifecycle-agent/bundle.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.resolve-sources.outputs.lifecycle_bundle_image }}
          cache-from: type=gha,scope=lifecycle-bundle
          cache-to: type=gha,mode=max,scope=lifecycle-bundle
          provenance: false
          sbom: false

      - name: Build and publish multi-arch catalogs
        shell: bash
        env:
          CERT_MANAGER_BUNDLE_IMAGE: ${{ needs.resolve-sources.outputs.cert_manager_bundle_image }}
          CERT_MANAGER_CATALOG_IMAGE: ${{ needs.resolve-sources.outputs.cert_manager_catalog_image }}
          LIFECYCLE_BUNDLE_IMAGE: ${{ needs.resolve-sources.outputs.lifecycle_bundle_image }}
          LIFECYCLE_CATALOG_IMAGE: ${{ needs.resolve-sources.outputs.lifecycle_catalog_image }}
        run: |
          set -euo pipefail

          build_catalog() {
            local directory="$1"
            local bundle_image="$2"
            local catalog_image="$3"

            for arch in amd64 arm64; do
              local arch_image="${catalog_image}-${arch}"
              export DOCKER_DEFAULT_PLATFORM="linux/$arch"

              if [[ "$directory" == cert-manager-operator ]]; then
                make -C "$directory" catalog-build \
                  CONTAINER_ENGINE=docker \
                  CATALOG_VERSION="$CERT_MANAGER_BUNDLE_VERSION" \
                  BUNDLE_IMG="$bundle_image" \
                  CATALOG_IMG="$arch_image"
              else
                make -C "$directory" catalog-build \
                  ENGINE=docker \
                  VERSION="$LIFECYCLE_BUNDLE_VERSION" \
                  BUNDLE_IMGS="$bundle_image" \
                  CATALOG_IMG="$arch_image"
              fi

              docker push "$arch_image"
            done

            unset DOCKER_DEFAULT_PLATFORM
            docker buildx imagetools create \
              --tag "$catalog_image" \
              "${catalog_image}-amd64" \
              "${catalog_image}-arm64"
          }

          build_catalog cert-manager-operator "$CERT_MANAGER_BUNDLE_IMAGE" "$CERT_MANAGER_CATALOG_IMAGE"
          build_catalog lifecycle-agent "$LIFECYCLE_BUNDLE_IMAGE" "$LIFECYCLE_CATALOG_IMAGE"

      - name: Publish build summary
        env:
          RECERT_IMAGE: ${{ needs.resolve-sources.outputs.recert_image }}
          CERT_MANAGER_IMAGE: ${{ needs.resolve-sources.outputs.cert_manager_image }}
          CERT_MANAGER_BUNDLE_IMAGE: ${{ needs.resolve-sources.outputs.cert_manager_bundle_image }}
          CERT_MANAGER_CATALOG_IMAGE: ${{ needs.resolve-sources.outputs.cert_manager_catalog_image }}
          LIFECYCLE_IMAGE: ${{ needs.resolve-sources.outputs.lifecycle_image }}
          LIFECYCLE_BUNDLE_IMAGE: ${{ needs.resolve-sources.outputs.lifecycle_bundle_image }}
          LIFECYCLE_CATALOG_IMAGE: ${{ needs.resolve-sources.outputs.lifecycle_catalog_image }}
        run: |
          {
            echo "### Published images"
            echo "- \`$RECERT_IMAGE\`"
            echo "- \`$CERT_MANAGER_IMAGE\`"
            echo "- \`$CERT_MANAGER_BUNDLE_IMAGE\`"
            echo "- \`$CERT_MANAGER_CATALOG_IMAGE\`"
            echo "- \`$LIFECYCLE_IMAGE\`"
            echo "- \`$LIFECYCLE_BUNDLE_IMAGE\`"
            echo "- \`$LIFECYCLE_CATALOG_IMAGE\`"
          } >> "$GITHUB_STEP_SUMMARY"
